name: Backfill betMeta (one-time / manual)

# Roda apenas manualmente. Reconstrói metadados (p, date, leagueKey)
# para apostas em betOutcomes sem betMeta completo.
# Após rodar, execute daily-scraper manualmente para recomputar assertHistory.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (true = não grava no Firestore)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install firebase-admin

      - name: Run backfill
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if ('${{ github.event.inputs.dry_run }}' -eq 'true') {
            python backfill_meta.py --dry-run
          } else {
            python backfill_meta.py
          }
