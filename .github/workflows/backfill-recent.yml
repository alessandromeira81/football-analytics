name: Backfill Recent Bets (one-time)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/trigger-backfill-recent'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install playwright firebase-admin

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run backfill
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python backfill_recent_bets.py
