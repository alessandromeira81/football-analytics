name: Daily Data Scraper

on:
  schedule:
    - cron: '0 12 * * *'  # 12h UTC = 9h BRT (self-hosted: PC precisa estar ligado)
  workflow_dispatch:       # permite rodar manualmente
  push:                    # trigger manual via push do arquivo marcador
    branches: [main]
    paths:
      - '.github/trigger-scraper'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: pip install playwright firebase-admin

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run scraper – MLS (sessao fresca, coleta prioritaria)
        run: python scraper.py --liga mls
        timeout-minutes: 30

      - name: Diagnostico MLS pos-coleta
        continue-on-error: true
        run: |
          if (Test-Path "mls_data.json") {
            $size = (Get-Item "mls_data.json").Length
            Write-Host "mls_data.json existe: $size bytes"
          } else {
            Write-Host "mls_data.json NAO existe — MLS nao coletou dados"
          }
          exit 0

      - name: Run scraper – all leagues
        run: python scraper.py --liga all
        timeout-minutes: 50

      - name: Run referee scraper – Brasileirao
        run: python scraper_refs.py
        timeout-minutes: 10

      - name: Re-inject JSON into HTML (refs now included)
        run: python scraper.py --inject --liga all

      - name: Salva bets >=80% em betMeta (server-side)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python save_upcoming_bets.py
        timeout-minutes: 5

      - name: Sync assertividade → Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python assertividade_sync.py
        timeout-minutes: 5

      - name: Gerar API publica (daily-picks + track-record)
        run: python generate_api.py
        timeout-minutes: 5

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json *.html api/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $today = Get-Date -Format 'yyyy-MM-dd'
            git commit -m "chore: atualiza dados das ligas $today"
          } else {
            Write-Host "Nada novo para commitar."
          }
          # Tenta push; se rejeitar (porque remote tem commits novos),
          # faz pull --rebase e tenta de novo. Repete ate 3 vezes.
          $attempt = 0
          while ($attempt -lt 3) {
            git push
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Push rejeitado (tentativa $($attempt+1)). Fazendo rebase..."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Rebase falhou (conflito). Abortando."
              git rebase --abort
              exit 1
            }
            $attempt++
          }

      - name: Purge jsDelivr CDN cache
        if: success()
        continue-on-error: true
        run: |
          # 1) Aguarda raw.githubusercontent.com ter o conteudo novo
          #    (raw.github tambem tem cache de ~5min, precisa atualizar antes)
          $rawUrl = 'https://raw.githubusercontent.com/alessandromeira81/football-analytics/main/api/track-record.json'
          $expectedDate = (Get-Date).ToString('yyyy-MM-dd')
          Write-Host "Aguardando raw.github refletir commit (timeout 3min)..."
          $i = 0
          while ($i -lt 18) {
            try {
              $r = Invoke-WebRequest -Uri $rawUrl -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 10
              $data = $r.Content | ConvertFrom-Json
              if ($data.generated_at -and $data.generated_at.StartsWith($expectedDate)) {
                Write-Host "Raw github OK (generated_at=$($data.generated_at))"
                break
              }
            } catch { }
            Start-Sleep -Seconds 10
            $i++
          }

          # 2) Purge jsDelivr (POST bulk)
          $paths = @(
            '/gh/alessandromeira81/football-analytics@main/api/daily-picks.json',
            '/gh/alessandromeira81/football-analytics@main/api/daily-picks/80.json',
            '/gh/alessandromeira81/football-analytics@main/api/daily-picks/85.json',
            '/gh/alessandromeira81/football-analytics@main/api/daily-picks/90.json',
            '/gh/alessandromeira81/football-analytics@main/api/daily-picks/95.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/3d/80.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/3d/85.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/3d/90.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/3d/95.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/7d/80.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/7d/85.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/7d/90.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks/7d/95.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record/7d.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record/30d.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record/all.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record-90.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record-90/7d.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record-90/30d.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record-90/all.json',
            '/gh/alessandromeira81/football-analytics@main/api/index.json'
          )
          $body = @{ path = $paths } | ConvertTo-Json
          try {
            $r = Invoke-RestMethod -Uri 'https://purge.jsdelivr.net/' -Method Post `
                  -ContentType 'application/json' -Body $body -TimeoutSec 30
            Write-Host "Purge enviado (id=$($r.id), status=$($r.status))"
          } catch {
            Write-Host "Purge POST warning: $_"
          }
