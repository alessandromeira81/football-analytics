name: Daily Data Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # 6h UTC = 3h BRT
  workflow_dispatch:       # permite rodar manualmente

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run scraper – all leagues
        run: python scraper.py --liga all
        timeout-minutes: 50

      - name: Run referee scraper – Brasileirao
        run: python scraper_refs.py
        timeout-minutes: 10

      - name: Install firebase-admin
        run: pip install firebase-admin

      - name: Sync assertividade → Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python assertividade_sync.py
        timeout-minutes: 5

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet || git commit -m "chore: atualiza dados das ligas $(date +'%Y-%m-%d')"
          git push
