name: Daily Data Scraper

on:
  schedule:
    - cron: '0 9 * * *'  # 9h UTC = 6h BRT (self-hosted: PC precisa estar ligado)
  workflow_dispatch:       # permite rodar manualmente

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: pip install playwright firebase-admin

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run scraper – all leagues
        run: python scraper.py --liga all
        timeout-minutes: 50

      - name: Run referee scraper – Brasileirao
        run: python scraper_refs.py
        timeout-minutes: 10

      - name: Sync assertividade → Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python assertividade_sync.py
        timeout-minutes: 5

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet && echo "Nada novo." || git commit -m "chore: atualiza dados das ligas $(date +'%Y-%m-%d')"
          git push
