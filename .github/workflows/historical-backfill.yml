name: Historical Backfill

# Backfill manual de temporadas passadas. NAO roda automaticamente.
# Triggered:
#   1) workflow_dispatch (manual via GitHub UI com inputs)
#   2) push de .github/trigger-backfill com conteudo "<liga> <ano>"

on:
  workflow_dispatch:
    inputs:
      liga:
        description: 'Liga (brasileirao, premier, laliga, bundesliga, ligue1, saudi, argentina, seriea, mls)'
        required: true
        type: string
      year:
        description: 'Ano (ex: 2024, 2023)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/trigger-backfill'

permissions:
  contents: write

jobs:
  backfill:
    # Self-hosted: IP residencial tem mais chance de passar pelo Sofascore
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull alteracoes recentes
        run: git pull origin main --no-edit

      - name: Install Python deps
        run: pip install playwright firebase-admin

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Le parametros (workflow_dispatch ou trigger file)
        id: params
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $liga = "${{ inputs.liga }}"
            $year = "${{ inputs.year }}"
            Write-Host "Modo: workflow_dispatch"
          } else {
            $content = (Get-Content .github/trigger-backfill -Raw -ErrorAction SilentlyContinue).Trim()
            $parts = $content -split '\s+' | Where-Object { $_ }
            if ($parts.Count -lt 2) {
              Write-Host "ERRO: .github/trigger-backfill deve ter formato '<liga> <year>'"
              exit 1
            }
            $liga = $parts[0]
            $year = $parts[1]
            Write-Host "Modo: trigger file ($content)"
          }
          Write-Host "Liga: $liga | Year: $year"
          "liga=$liga" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "year=$year" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run backfill
        run: python backfill_historical.py --liga ${{ steps.params.outputs.liga }} --year ${{ steps.params.outputs.year }}
        timeout-minutes: 75

      - name: Re-inject JSONs no app.html
        run: python scraper.py --inject --liga all

      - name: Regenera API publica
        run: python generate_api.py

      - name: Sync assertividade (revalida com novo historico)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python assertividade_sync.py
        timeout-minutes: 5

      - name: Commit backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json *.html api/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $liga = "${{ steps.params.outputs.liga }}"
            $year = "${{ steps.params.outputs.year }}"
            git commit -m "feat: backfill historico $liga $year"
            $attempt = 0
            while ($attempt -lt 3) {
              git push
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Push rejeitado. Rebase..."
              git pull --rebase origin main
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort
                exit 1
              }
              $attempt++
            }
          } else {
            Write-Host "Nada para commitar (nenhum jogo novo)."
          }

      - name: Purge jsDelivr CDN
        if: success()
        continue-on-error: true
        run: |
          $paths = @(
            '/gh/alessandromeira81/football-analytics@main/api/track-record.json',
            '/gh/alessandromeira81/football-analytics@main/api/track-record-90.json',
            '/gh/alessandromeira81/football-analytics@main/api/daily-picks.json',
            '/gh/alessandromeira81/football-analytics@main/api/upcoming-picks.json',
            '/gh/alessandromeira81/football-analytics@main/api/index.json'
          )
          $body = @{ path = $paths } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri 'https://purge.jsdelivr.net/' -Method Post `
                  -ContentType 'application/json' -Body $body -TimeoutSec 30
          } catch { }
