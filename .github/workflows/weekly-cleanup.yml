name: Weekly Cleanup (Terça 20h BRT)

on:
  schedule:
    - cron: '0 23 * * 2'   # toda terça às 23h UTC = 20h BRT
  workflow_dispatch:         # permite rodar manualmente

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove jogos passados de scheduledGames
        run: python cleanup_scheduled.py

      - name: Commit se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $today = Get-Date -Format 'yyyy-MM-dd'
            git commit -m "chore: remove insights passados de scheduledGames ($today)"
          } else {
            Write-Host "Nenhum jogo passado encontrado."
          }
          git push
